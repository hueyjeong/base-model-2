[package]
name = "dense-editor-wgpu"
version = "0.1.0"
edition = "2021"
description = "DenseEditor wgpu GPU inference engine — cross-platform (Vulkan/Metal/DX12)"

[dependencies]
inference-common = { path = "../inference_common" }
wgpu = { version = "24", features = ["counters"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
