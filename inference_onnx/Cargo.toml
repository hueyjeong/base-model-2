[package]
name = "inference-onnx"
version = "0.1.0"
edition = "2021"
description = "Diamond ELECTRA ONNX Runtime inference benchmark"

[dependencies]
ort = { version = "2.0.0-rc.12", features = ["cuda", "ndarray"] }
ndarray = "0.16"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
