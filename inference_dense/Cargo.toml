[package]
name = "dense-editor-inference"
version = "0.1.0"
edition = "2021"
description = "DenseEditor CPU inference engine — 6종 mixing layer 벤치마크"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustfft = "6"

[features]
default = []
avx2-only = []

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
